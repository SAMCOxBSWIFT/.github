" r="4" fill="#7C6CFF"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle><circle cx="900" cy="280" r="10" fill="none" stroke="#7C6CFF" stroke-opacity="0.35"/>
